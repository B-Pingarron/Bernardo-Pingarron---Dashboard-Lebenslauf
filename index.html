<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bernardo Pingarrón Cárdenas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F4EFE4;
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .card {
    width: 100%;
    max-width: 700px;
    text-align: center;
    padding: 2rem;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    font-weight: 700;
    color: #1C1C1C;
    letter-spacing: -0.02em;
    line-height: 1.1;
    padding-bottom: 1rem;
    margin-bottom: 2.5rem;
    border-bottom: 2px solid #9A3E2A;
  }

  .links {
    display: flex;
    gap: 2.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .links a {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8125rem;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #3A3A3A;
    text-decoration: none;
    padding-bottom: 0.2rem;
    border-bottom: 1px solid transparent;
    transition: color 0.25s ease, border-bottom-color 0.25s ease;
  }

  .links a:hover {
    color: #9A3E2A;
    border-bottom-color: #9A3E2A;
  }

  @media (max-width: 520px) {
    .links { gap: 1.25rem; flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="name">
      <div>Bernardo</div>
      <div>Pingarrón Cárdenas</div>
    </div>
    <div class="links">
      <a href="Dashboard/dist/dashboard_en.html">English</a>
      <a href="Dashboard/dist/dashboard_de.html">Deutsch</a>
      <a href="Dashboard/dist/dashboard_es.html">Español</a>
    </div>
  </div>
</body>
</html>
