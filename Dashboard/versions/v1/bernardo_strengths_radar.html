<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bernardo's Strengths</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f0e8;
    --surface: #e8e8df;
    --card: #ffffff;
    --olive: #486102;
    --olive-light: #6a8c0a;
    --burgundy: #7a1e3a;
    --burgundy-light: #a02a50;
    --text: #1a1a1a;
    --muted: #6a6a5a;
    --border: rgba(0,0,0,0.08);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 48px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 64px;
  }

  /* Subtle grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.3;
  }

  .header {
    text-align: center;
    position: relative; z-index: 1;
    animation: fadeUp 0.8s ease both;
  }

  .header .label {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--olive);
    margin-bottom: 10px;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 900;
    line-height: 1.05;
    background: linear-gradient(135deg, var(--olive) 0%, var(--burgundy) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 10px;
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  .header .label {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--olive);
    margin-bottom: 10px;
  }

  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 40px;
    width: 100%;
    max-width: 1100px;
    position: relative; z-index: 1;
  }

  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.9s ease both;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  }

  .chart-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 60px rgba(0,0,0,0.12);
  }

  .chart-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 20px 20px 0 0;
  }
  .chart-card.olive::before { background: linear-gradient(90deg, transparent, var(--olive), transparent); }
  .chart-card.burgundy::before { background: linear-gradient(90deg, transparent, var(--burgundy), transparent); }

  .chart-card .glow {
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.05;
    pointer-events: none;
  }
  .chart-card.olive .glow { background: var(--olive); top: -80px; right: -80px; }
  .chart-card.burgundy .glow { background: var(--burgundy); top: -80px; left: -80px; }

  .card-title {
    text-align: center;
  }
  .card-title .tag {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .card-title h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
  }
  .chart-card.olive .card-title h2 { color: var(--olive); }
  .chart-card.burgundy .card-title h2 { color: var(--burgundy); }

  canvas { max-width: 100%; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 16px;
    margin-top: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .mbti-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(72,97,2,0.08);
    border: 1px solid rgba(72,97,2,0.2);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 0.8rem;
    color: var(--olive);
    letter-spacing: 0.06em;
    margin-top: 4px;
  }
  .mbti-badge strong { font-weight: 700; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chart-card:nth-child(2) { animation-delay: 0.15s; }
</style>
</head>
<body>

<header class="header">
  <p class="label">Career Profile · 2025</p>
  <h1>Bernardo's<br>Strengths Sheet</h1>
  <p>A visual summary of personality assessments &amp; competency scores</p>
  <div class="mbti-badge"><strong>INFP-A</strong> · Mediator · 67% Introverted · 88% Intuitive</div>
</header>

<div class="charts-grid">

  <!-- Chart 1: Work Competencies -->
  <div class="chart-card olive">
    <div class="glow"></div>
    <div class="card-title">
      <p class="tag">O*NET Assessment</p>
      <h2>Work Competencies</h2>
    </div>
    <canvas id="competencies" width="340" height="340"></canvas>
  </div>

  <!-- Chart 2: Personality Strengths -->
  <div class="chart-card burgundy">
    <div class="glow"></div>
    <div class="card-title">
      <p class="tag">MBTI · VIA · Gallup</p>
      <h2>Personality Strengths</h2>
    </div>
    <canvas id="personality" width="340" height="340"></canvas>
  </div>

</div>

<script>
  const radarOptions = (color) => ({
    responsive: false,
    animation: { duration: 1200, easing: 'easeOutQuart' },
    scales: {
      r: {
        min: 0,
        max: 100,
        beginAtZero: true,
        ticks: { display: false, stepSize: 20 },
        grid: { color: 'rgba(0,0,0,0.08)' },
        angleLines: { color: 'rgba(0,0,0,0.10)' },
        pointLabels: {
          color: '#444438',
          font: { family: 'DM Sans', size: 12, weight: '500' },
          padding: 14,
        }
      }
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#ffffff',
        borderColor: 'rgba(0,0,0,0.12)',
        borderWidth: 1,
        titleColor: '#1a1a1a',
        bodyColor: '#666660',
        padding: 10,
        callbacks: { label: ctx => ` Score: ${ctx.raw}` }
      }
    }
  });

  // ─── Chart 1: Work Competencies (top 5 for data analyst) ──────
  // Adaptability (80), Innovation (70), Independence (63),
  // Achievement/Effort (60), Social Orientation (65)
  new Chart(document.getElementById('competencies'), {
    type: 'radar',
    data: {
      labels: ['Adaptability', 'Innovation', 'Social\nOrientation', 'Independence', 'Achievement\n& Effort'],
      datasets: [{
        data: [80, 70, 65, 63, 60],
        borderColor: '#486102',
        backgroundColor: 'rgba(72,97,2,0.18)',
        borderWidth: 2.5,
        pointBackgroundColor: '#486102',
        pointBorderColor: '#f0f0e8',
        pointBorderWidth: 2,
        pointRadius: 5,
        pointHoverRadius: 7,
      }]
    },
    options: radarOptions('#486102')
  });

  // ─── Chart 2: Personality Strengths (6 for data analyst) ──────
  // Empathy/Social Intel, Strategic Thinking, Learning & Curiosity,
  // Creative Vision, Perspective, Emotional Intelligence
  new Chart(document.getElementById('personality'), {
    type: 'radar',
    data: {
      labels: ['Empathy &\nCollaboration', 'Strategic\nThinking', 'Learning &\nCuriosity', 'Creative\nVision', 'Perspective', 'Emotional\nIntelligence'],
      datasets: [{
        data: [92, 78, 88, 85, 80, 88],
        borderColor: '#7a1e3a',
        backgroundColor: 'rgba(122,30,58,0.15)',
        borderWidth: 2.5,
        pointBackgroundColor: '#7a1e3a',
        pointBorderColor: '#f0f0e8',
        pointBorderWidth: 2,
        pointRadius: 5,
        pointHoverRadius: 7,
      }]
    },
    options: radarOptions('#7a1e3a')
  });
</script>
</body>
</html>
